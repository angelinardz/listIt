<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ListIt — Grocery List</title>
<link rel="stylesheet" href="auth.css">
<style>
  :root{
    --green-deep:#3f7a5c;
    --green:#5c9a78;
    --green-light:#e6f2ea;
    --cream:#faf8f4;
    --ink:#28352e;
    --ink-soft:#6b7a72;
    --line:#e0e6e1;
    --white:#ffffff;
    --danger:#c96a5a;
    --radius:18px;
    --shadow: 0 4px 16px rgba(40,53,46,0.08);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--cream);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }

  .header{
    position:relative;
    background:var(--green-deep);
    color:var(--white);
    padding:28px 20px 34px;
    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
    text-align:center;
  }
  .header .logout-btn{
    position:absolute;
    top:16px;
    right:16px;
  }
  .header h1{
    margin:0;
    font-size:28px;
    letter-spacing:0.5px;
    font-weight:700;
  }
  .header p{
    margin:6px 0 0;
    font-size:16px;
    opacity:0.9;
  }

  .nav-wrap{
    max-width:640px;
    margin:-18px auto 0;
    padding:0 20px;
    display:flex;
    justify-content:center;
  }
  .nav-tabs{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:6px;
    display:flex;
    gap:6px;
  }
  .nav-tab{
    padding:10px 20px;
    border-radius:12px;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    color:var(--ink-soft);
  }
  .nav-tab.active{
    background:var(--green);
    color:var(--white);
  }

  .progress-wrap{
    max-width:640px;
    margin:20px auto 0;
    padding:0 20px;
  }
  .progress-card{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .progress-text{
    font-size:16px;
    font-weight:600;
  }
  .progress-bar-bg{
    flex:1;
    height:12px;
    background:var(--green-light);
    border-radius:20px;
    overflow:hidden;
    margin-left:16px;
  }
  .progress-bar-fill{
    height:100%;
    background:var(--green);
    border-radius:20px;
    transition:width 0.3s ease;
    width:0%;
  }

  .add-wrap{
    max-width:640px;
    margin:20px auto 0;
    padding:0 20px;
  }
  .add-card{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
  }
  .add-card h2{
    margin:0 0 12px;
    font-size:18px;
    font-weight:700;
  }
  .add-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .add-row input[type="text"]{
    flex:1 1 180px;
    font-size:18px;
    padding:14px 16px;
    border:2px solid var(--line);
    border-radius:12px;
    outline:none;
    min-width:0;
  }
  .add-row input[type="text"]:focus{
    border-color:var(--green);
  }
  .add-row select{
    flex:1 1 160px;
    font-size:17px;
    padding:14px 12px;
    border:2px solid var(--line);
    border-radius:12px;
    background:var(--white);
    outline:none;
  }
  .add-row select:focus{
    border-color:var(--green);
  }
  .add-btn{
    background:var(--green);
    color:var(--white);
    border:none;
    font-size:18px;
    font-weight:700;
    padding:14px 26px;
    border-radius:12px;
    cursor:pointer;
    min-height:52px;
  }
  .add-btn:hover{ background:var(--green-deep); }
  .add-btn:active{ transform:scale(0.98); }

  .list-wrap{
    max-width:640px;
    margin:24px auto 0;
    padding:0 20px;
  }

  .category{
    margin-bottom:22px;
  }
  .category-title{
    font-size:18px;
    font-weight:700;
    margin:0 0 10px 4px;
    color:var(--green-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .category-count{
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--green-light);
    padding:2px 10px;
    border-radius:20px;
  }

  .item-card{
    background:var(--white);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:10px;
  }
  .item-card.checked{
    background:var(--green-light);
  }

  .checkbox{
    width:32px;
    height:32px;
    min-width:32px;
    border-radius:8px;
    border:2.5px solid var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background:var(--white);
    flex-shrink:0;
  }
  .checkbox.checked{
    background:var(--green);
  }
  .checkbox svg{
    width:20px;
    height:20px;
    display:none;
  }
  .checkbox.checked svg{ display:block; }

  .item-name{
    flex:1;
    font-size:19px;
    font-weight:600;
    min-width:0;
    word-break:break-word;
  }
  .item-card.checked .item-name{
    text-decoration:line-through;
    color:var(--ink-soft);
  }

  .qty-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .qty-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--white);
    font-size:20px;
    font-weight:700;
    color:var(--green-deep);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .qty-btn:hover{ background:var(--green-light); }
  .qty-num{
    font-size:18px;
    font-weight:700;
    min-width:22px;
    text-align:center;
  }

  .remove-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    border:none;
    background:transparent;
    color:var(--danger);
    font-size:22px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .remove-btn:hover{ background:#f6e6e3; }

  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:17px;
    padding:40px 20px;
  }

  .footer-actions{
    max-width:640px;
    margin:26px auto 0;
    padding:0 20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .footer-btn{
    flex:1;
    min-width:150px;
    padding:14px;
    font-size:16px;
    font-weight:700;
    border-radius:12px;
    border:2px solid var(--line);
    background:var(--white);
    color:var(--ink);
    cursor:pointer;
  }
  .footer-btn:hover{ background:var(--green-light); border-color:var(--green); }
  .footer-btn.danger{
    color:var(--danger);
  }
  .footer-btn.danger:hover{
    background:#f6e6e3;
    border-color:var(--danger);
  }

  @media (max-width:420px){
    .item-name{ font-size:17px; }
    .header h1{ font-size:24px; }
  }
</style>
</head>
<body>

  <div class="header">
    <button class="logout-btn" id="logoutBtn">Log out</button>
    <h1>🥕 ListIt</h1>
    <p>Your grocery shopping list, made simple</p>
  </div>

  <div class="nav-wrap">
    <div class="nav-tabs">
      <a class="nav-tab active" href="index.html">Grocery List</a>
      <a class="nav-tab" href="recipes.html">Recipes</a>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-card">
      <div class="progress-text" id="progressText">0 of 0 items</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <div class="add-wrap">
    <div class="add-card">
      <h2>Add an item</h2>
      <div class="add-row">
        <input type="text" id="itemInput" placeholder="e.g. Eggs" />
        <select id="categorySelect"></select>
        <button class="add-btn" id="addBtn">+ Add</button>
      </div>
    </div>
  </div>

  <div class="list-wrap" id="listWrap"></div>

  <div class="footer-actions">
    <button class="footer-btn" id="clearCheckedBtn">Clear checked items</button>
    <button class="footer-btn danger" id="clearAllBtn">Clear entire list</button>
  </div>

<script type="module">
  import { supabase, requireAuth, logout } from "./auth.js";

  document.getElementById('logoutBtn').addEventListener('click', logout);

  const CATEGORIES = [
    "Produce",
    "Meat & Fish",
    "Dairy & Eggs",
    "Bakery & Snacks",
    "Beverages",
    "Cooking Oil & Ghee",
    "Chips & Crisps",
    "Other"
  ];

  let items = [];

  const listWrap = document.getElementById('listWrap');
  const itemInput = document.getElementById('itemInput');
  const categorySelect = document.getElementById('categorySelect');
  const addBtn = document.getElementById('addBtn');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');

  CATEGORIES.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    categorySelect.appendChild(opt);
  });

  function render(){
    listWrap.innerHTML = '';

    if(items.length === 0){
      listWrap.innerHTML = '<div class="empty-state">Your list is empty. Add something above to get started 🛒</div>';
      updateProgress();
      return;
    }

    CATEGORIES.forEach(cat => {
      const catItems = items.filter(i => i.category === cat);
      if(catItems.length === 0) return;

      const section = document.createElement('div');
      section.className = 'category';

      const title = document.createElement('div');
      title.className = 'category-title';
      const checkedCount = catItems.filter(i => i.checked).length;
      title.innerHTML = `${cat} <span class="category-count">${checkedCount}/${catItems.length}</span>`;
      section.appendChild(title);

      catItems.forEach(item => {
        section.appendChild(buildItemCard(item));
      });

      listWrap.appendChild(section);
    });

    updateProgress();
  }

  function buildItemCard(item){
    const card = document.createElement('div');
    card.className = 'item-card' + (item.checked ? ' checked' : '');

    const checkbox = document.createElement('div');
    checkbox.className = 'checkbox' + (item.checked ? ' checked' : '');
    checkbox.setAttribute('role', 'checkbox');
    checkbox.setAttribute('aria-checked', item.checked);
    checkbox.setAttribute('tabindex', '0');
    checkbox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    checkbox.addEventListener('click', () => toggleChecked(item.id));
    checkbox.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        toggleChecked(item.id);
      }
    });

    const name = document.createElement('div');
    name.className = 'item-name';
    name.textContent = item.name;

    const qtyWrap = document.createElement('div');
    qtyWrap.className = 'qty-controls';

    const minusBtn = document.createElement('button');
    minusBtn.className = 'qty-btn';
    minusBtn.textContent = '−';
    minusBtn.setAttribute('aria-label', 'Decrease quantity');
    minusBtn.addEventListener('click', () => changeQty(item.id, -1));

    const qtyNum = document.createElement('div');
    qtyNum.className = 'qty-num';
    qtyNum.textContent = item.qty;

    const plusBtn = document.createElement('button');
    plusBtn.className = 'qty-btn';
    plusBtn.textContent = '+';
    plusBtn.setAttribute('aria-label', 'Increase quantity');
    plusBtn.addEventListener('click', () => changeQty(item.id, 1));

    qtyWrap.appendChild(minusBtn);
    qtyWrap.appendChild(qtyNum);
    qtyWrap.appendChild(plusBtn);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.innerHTML = '✕';
    removeBtn.setAttribute('aria-label', 'Remove item');
    removeBtn.addEventListener('click', () => removeItem(item.id));

    card.appendChild(checkbox);
    card.appendChild(name);
    card.appendChild(qtyWrap);
    card.appendChild(removeBtn);

    return card;
  }

  async function toggleChecked(id){
    const item = items.find(i => i.id === id);
    if(item){
      await supabase.from('grocery_list').update({ checked: !item.checked }).eq('id', id);
    }
  }

  async function changeQty(id, delta){
    const item = items.find(i => i.id === id);
    if(item){
      const newQty = Math.max(1, item.qty + delta);
      await supabase.from('grocery_list').update({ qty: newQty }).eq('id', id);
    }
  }

  async function removeItem(id){
    await supabase.from('grocery_list').delete().eq('id', id);
  }

  function updateProgress(){
    const total = items.length;
    const checked = items.filter(i => i.checked).length;
    progressText.textContent = total === 0 ? '0 of 0 items' : `${checked} of ${total} items`;
    const pct = total === 0 ? 0 : Math.round((checked / total) * 100);
    progressFill.style.width = pct + '%';
  }

  async function addItem(){
    const name = itemInput.value.trim();
    if(!name) {
      itemInput.focus();
      return;
    }
    await supabase.from('grocery_list').insert({
      name: name,
      category: categorySelect.value,
      qty: 1,
      checked: false
    });
    itemInput.value = '';
    itemInput.focus();
  }

  addBtn.addEventListener('click', addItem);
  itemInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      addItem();
    }
  });

  document.getElementById('clearCheckedBtn').addEventListener('click', async () => {
    const ids = items.filter(i => i.checked).map(i => i.id);
    if(ids.length === 0) return;
    await supabase.from('grocery_list').delete().in('id', ids);
  });

  document.getElementById('clearAllBtn').addEventListener('click', async () => {
    if(items.length === 0) return;
    if(confirm('Clear your entire list? This cannot be undone.')){
      const ids = items.map(i => i.id);
      await supabase.from('grocery_list').delete().in('id', ids);
    }
  });

  async function loadItems(){
    const { data, error } = await supabase
      .from('grocery_list')
      .select('*')
      .order('created_at', { ascending: true });

    if(error){
      console.error("Supabase error:", error);
      listWrap.innerHTML = '<div class="empty-state">Couldn\'t connect to the list. Check your internet connection and reload.</div>';
      return;
    }

    items = data;
    render();
  }

  requireAuth(() => {
    supabase
      .channel('grocery_list_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'grocery_list' }, loadItems)
      .subscribe();

    loadItems();
  });
</script>

</body>
</html>
