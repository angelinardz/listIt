<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ListIt — Recipes</title>
<link rel="stylesheet" href="auth.css">
<style>
  :root{
    --green-deep:#3f7a5c;
    --green:#5c9a78;
    --green-light:#e6f2ea;
    --cream:#faf8f4;
    --ink:#28352e;
    --ink-soft:#6b7a72;
    --line:#e0e6e1;
    --white:#ffffff;
    --danger:#c96a5a;
    --radius:18px;
    --shadow: 0 4px 16px rgba(40,53,46,0.08);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--cream);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }

  .header{
    position:relative;
    background:var(--green-deep);
    color:var(--white);
    padding:28px 20px 34px;
    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
    text-align:center;
  }
  .header .logout-btn{
    position:absolute;
    top:16px;
    right:16px;
  }
  .header h1{
    margin:0;
    font-size:28px;
    letter-spacing:0.5px;
    font-weight:700;
  }
  .header p{
    margin:6px 0 0;
    font-size:16px;
    opacity:0.9;
  }

  .nav-wrap{
    max-width:640px;
    margin:-18px auto 0;
    padding:0 20px;
    display:flex;
    justify-content:center;
  }
  .nav-tabs{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:6px;
    display:flex;
    gap:6px;
  }
  .nav-tab{
    padding:10px 20px;
    border-radius:12px;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    color:var(--ink-soft);
  }
  .nav-tab.active{
    background:var(--green);
    color:var(--white);
  }

  .add-wrap{
    max-width:640px;
    margin:20px auto 0;
    padding:0 20px;
  }
  .add-card{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
  }
  .add-card h2{
    margin:0 0 12px;
    font-size:18px;
    font-weight:700;
  }
  .add-card input[type="text"]{
    font-size:18px;
    padding:14px 16px;
    border:2px solid var(--line);
    border-radius:12px;
    outline:none;
    width:100%;
  }
  .add-card input[type="text"]:focus{
    border-color:var(--green);
  }

  .recipe-name-input{
    margin-bottom:14px;
  }

  .ingredient-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:8px;
  }
  .ingredient-row input[type="text"]{
    padding:12px 14px;
    border:2px solid var(--line);
    border-radius:10px;
    outline:none;
    font-size:16px;
  }
  .ingredient-row input[type="text"]:focus{
    border-color:var(--green);
  }
  .ing-name{ flex:2 1 160px; min-width:0; }
  .ing-qty{ flex:1 1 70px; min-width:0; }
  .ing-unit{ flex:1 1 90px; min-width:0; }

  .ing-remove-btn{
    width:40px;
    height:40px;
    border-radius:10px;
    border:none;
    background:transparent;
    color:var(--danger);
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
  }
  .ing-remove-btn:hover{ background:#f6e6e3; }

  .add-ing-btn{
    background:var(--green-light);
    color:var(--green-deep);
    border:2px dashed var(--green);
    font-size:15px;
    font-weight:700;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    margin-top:4px;
  }
  .add-ing-btn:hover{ background:#dcefe4; }

  .save-recipe-btn{
    background:var(--green);
    color:var(--white);
    border:none;
    font-size:18px;
    font-weight:700;
    padding:14px 26px;
    border-radius:12px;
    cursor:pointer;
    min-height:52px;
    width:100%;
    margin-top:14px;
  }
  .save-recipe-btn:hover{ background:var(--green-deep); }
  .save-recipe-btn:active{ transform:scale(0.98); }

  .list-wrap{
    max-width:640px;
    margin:24px auto 0;
    padding:0 20px;
  }

  .recipe-card{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:14px;
    overflow:hidden;
  }
  .recipe-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    cursor:pointer;
  }
  .recipe-title{
    flex:1;
    font-size:19px;
    font-weight:700;
    min-width:0;
    word-break:break-word;
  }
  .recipe-count{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--green-light);
    padding:2px 10px;
    border-radius:20px;
    flex-shrink:0;
  }
  .recipe-chevron{
    font-size:14px;
    color:var(--ink-soft);
    transition:transform 0.2s ease;
    flex-shrink:0;
  }
  .recipe-card.open .recipe-chevron{
    transform:rotate(180deg);
  }

  .recipe-body{
    display:none;
    padding:0 18px 18px;
  }
  .recipe-card.open .recipe-body{
    display:block;
  }

  .ing-list{
    list-style:none;
    margin:0 0 14px;
    padding:0;
  }
  .ing-list li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:16px;
  }
  .ing-list li:last-child{ border-bottom:none; }
  .ing-list .ing-amount{
    color:var(--ink-soft);
    font-weight:600;
    flex-shrink:0;
  }

  .recipe-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .recipe-actions button{
    flex:1;
    min-width:130px;
    padding:12px;
    font-size:15px;
    font-weight:700;
    border-radius:10px;
    border:2px solid var(--line);
    background:var(--white);
    color:var(--ink);
    cursor:pointer;
  }
  .recipe-actions button:hover{ background:var(--green-light); border-color:var(--green); }
  .recipe-actions button.danger{ color:var(--danger); }
  .recipe-actions button.danger:hover{ background:#f6e6e3; border-color:var(--danger); }

  .empty-state{
    text-align:center;
    color:var(--ink-soft);
    font-size:17px;
    padding:40px 20px;
  }

  @media (max-width:420px){
    .header h1{ font-size:24px; }
    .recipe-title{ font-size:17px; }
  }
</style>
</head>
<body>

  <div class="header">
    <button class="logout-btn" id="logoutBtn">Log out</button>
    <h1>📖 Recipes</h1>
    <p>Save recipes and add their ingredients to your list</p>
  </div>

  <div class="nav-wrap">
    <div class="nav-tabs">
      <a class="nav-tab" href="index.html">Grocery List</a>
      <a class="nav-tab active" href="recipes.html">Recipes</a>
    </div>
  </div>

  <div class="add-wrap">
    <div class="add-card">
      <h2>Add a recipe</h2>
      <input type="text" id="recipeNameInput" class="recipe-name-input" placeholder="Recipe name, e.g. Chicken Curry" />
      <div id="ingredientRows"></div>
      <button class="add-ing-btn" id="addIngRowBtn">+ Add ingredient</button>
      <button class="save-recipe-btn" id="saveRecipeBtn">Save recipe</button>
    </div>
  </div>

  <div class="list-wrap" id="recipeListWrap"></div>

<script type="module">
  import { supabase, requireAuth, logout } from "./auth.js";

  document.getElementById('logoutBtn').addEventListener('click', logout);

  let recipes = [];
  const openIds = new Set();

  const ingredientRows = document.getElementById('ingredientRows');
  const addIngRowBtn = document.getElementById('addIngRowBtn');
  const saveRecipeBtn = document.getElementById('saveRecipeBtn');
  const recipeNameInput = document.getElementById('recipeNameInput');
  const recipeListWrap = document.getElementById('recipeListWrap');

  function addIngredientRow(){
    const row = document.createElement('div');
    row.className = 'ingredient-row';
    row.innerHTML = `
      <input type="text" class="ing-name" placeholder="Ingredient, e.g. Flour" />
      <input type="text" class="ing-qty" placeholder="Qty" />
      <input type="text" class="ing-unit" placeholder="Unit, e.g. cups" />
      <button type="button" class="ing-remove-btn" aria-label="Remove ingredient">✕</button>
    `;
    row.querySelector('.ing-remove-btn').addEventListener('click', () => {
      if(ingredientRows.children.length > 1){
        row.remove();
      } else {
        row.querySelectorAll('input').forEach(i => i.value = '');
      }
    });
    ingredientRows.appendChild(row);
  }

  addIngRowBtn.addEventListener('click', addIngredientRow);
  addIngredientRow();

  function collectIngredients(){
    const rows = [...ingredientRows.querySelectorAll('.ingredient-row')];
    return rows.map(row => ({
      name: row.querySelector('.ing-name').value.trim(),
      qty: row.querySelector('.ing-qty').value.trim(),
      unit: row.querySelector('.ing-unit').value.trim()
    })).filter(ing => ing.name);
  }

  async function saveRecipe(){
    const name = recipeNameInput.value.trim();
    const ingredients = collectIngredients();

    if(!name){
      recipeNameInput.focus();
      return;
    }
    if(ingredients.length === 0){
      ingredientRows.querySelector('.ing-name').focus();
      return;
    }

    await supabase.from('recipes').insert({ name, ingredients });

    recipeNameInput.value = '';
    ingredientRows.innerHTML = '';
    addIngredientRow();
    recipeNameInput.focus();
  }

  saveRecipeBtn.addEventListener('click', saveRecipe);

  function formatAmount(ing){
    return [ing.qty, ing.unit].filter(Boolean).join(' ');
  }

  async function addRecipeToGroceryList(recipe){
    const rows = recipe.ingredients.map(ing => {
      const qtyNum = parseInt(ing.qty, 10);
      return {
        name: ing.unit ? `${ing.name} (${formatAmount(ing)})` : ing.name,
        category: 'Other',
        qty: Number.isFinite(qtyNum) && qtyNum > 0 ? qtyNum : 1,
        checked: false
      };
    });
    await supabase.from('grocery_list').insert(rows);
  }

  function buildRecipeCard(recipe){
    const card = document.createElement('div');
    card.className = 'recipe-card' + (openIds.has(recipe.id) ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'recipe-head';
    head.innerHTML = `
      <div class="recipe-title">${recipe.name}</div>
      <div class="recipe-count">${recipe.ingredients.length} ingredient${recipe.ingredients.length === 1 ? '' : 's'}</div>
      <div class="recipe-chevron">▼</div>
    `;
    head.addEventListener('click', () => {
      if(openIds.has(recipe.id)){
        openIds.delete(recipe.id);
      } else {
        openIds.add(recipe.id);
      }
      render();
    });

    const body = document.createElement('div');
    body.className = 'recipe-body';

    const ul = document.createElement('ul');
    ul.className = 'ing-list';
    recipe.ingredients.forEach(ing => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${ing.name}</span><span class="ing-amount">${formatAmount(ing)}</span>`;
      ul.appendChild(li);
    });

    const actions = document.createElement('div');
    actions.className = 'recipe-actions';

    const addBtn = document.createElement('button');
    addBtn.textContent = 'Add to grocery list';
    addBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      addRecipeToGroceryList(recipe);
    });

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'danger';
    deleteBtn.textContent = 'Delete recipe';
    deleteBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(confirm(`Delete "${recipe.name}"? This cannot be undone.`)){
        await supabase.from('recipes').delete().eq('id', recipe.id);
      }
    });

    actions.appendChild(addBtn);
    actions.appendChild(deleteBtn);

    body.appendChild(ul);
    body.appendChild(actions);

    card.appendChild(head);
    card.appendChild(body);

    return card;
  }

  function render(){
    recipeListWrap.innerHTML = '';

    if(recipes.length === 0){
      recipeListWrap.innerHTML = '<div class="empty-state">No recipes saved yet. Add one above to get started 🍲</div>';
      return;
    }

    recipes.forEach(recipe => {
      recipeListWrap.appendChild(buildRecipeCard(recipe));
    });
  }

  async function loadRecipes(){
    const { data, error } = await supabase
      .from('recipes')
      .select('*')
      .order('created_at', { ascending: true });

    if(error){
      console.error("Supabase error:", error);
      recipeListWrap.innerHTML = '<div class="empty-state">Couldn\'t connect to your recipes. Check your internet connection and reload.</div>';
      return;
    }

    recipes = data;
    render();
  }

  requireAuth(() => {
    supabase
      .channel('recipes_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'recipes' }, loadRecipes)
      .subscribe();

    loadRecipes();
  });
</script>

</body>
</html>
